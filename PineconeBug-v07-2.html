:root{font-family:system-ui,-apple-system,sans-serif;color:#f4eee3;background:#101e25}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 85% 4%,#52647a 0%,transparent 38%),linear-gradient(155deg,#14252e,#233f3c 65%,#101d25);padding-bottom:92px}.app{max-width:650px;margin:auto;padding:22px 16px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-family:Georgia,serif;font-size:31px;margin:4px 0}h2{font-size:18px;margin:0 0 12px}p{line-height:1.45}.muted{color:#c6d0c8;font-size:13px}.eyebrow{font-size:11px;letter-spacing:2px;color:#e7ce94;text-transform:uppercase}.moon{font-size:34px}.card{background:rgba(13,30,34,.79);border:1px solid rgba(230,222,188,.22);border-radius:19px;padding:17px;margin:14px 0;box-shadow:0 10px 24px #09131635}.hero{display:flex;gap:18px;align-items:center}.bug{font-size:67px;filter:drop-shadow(0 4px 8px #050a0b)}button,select,input{font:inherit}button{border:0;border-radius:12px;padding:11px 13px;background:#d7b97b;color:#152529;font-weight:650;cursor:pointer}button.secondary{background:#344c4c;color:#fff}button.ghost{background:transparent;border:1px solid #748983;color:#f6eee1}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f7d78c}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mood{background:#243b40;color:#fff;border:1px solid #6e8281;min-height:103px}.mood span{display:block;font-size:38px}.mood.selected{outline:3px solid #e9ca88}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tile{min-height:116px;background:rgba(22,45,48,.9);border:1px solid #4d6665;border-radius:16px;padding:14px}.tile h2{font-size:16px}.tile .symbol{font-size:25px;margin-bottom:10px}.full{grid-column:1/-1}input,select{background:#263f42;border:1px solid #718884;border-radius:9px;color:white;padding:11px;min-width:0}input[type=checkbox]{accent-color:#d7b97b}.task{display:flex;gap:10px;align-items:center;margin:9px 0}.task.done{text-decoration:line-through;color:#b3bcb7}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:#14282c;border-top:1px solid #60716b;padding:9px 4px max(12px,env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:#d5dcd3;font-size:12px;padding:8px 6px}.nav button.active{color:#ffda8b}.hidden{display:none!important}.settings-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #465d5a;gap:10px}.chip{display:inline-block;padding:6px 10px;border-radius:30px;background:#344d4b;font-size:12px}.sun{background:linear-gradient(155deg,#a7c9c3,#e8dfba 70%);color:#1d3433}.sun .card,.sun .tile{background:#ffffffd9;color:#193537}.sun .muted{color:#4e6562}.sun .eyebrow{color:#71531e}.sun .nav{background:#d9e6df}.sun .nav button{color:#28443d}.plain{background:#26343a}.plain .card,.plain .tile{box-shadow:none}.notice{font-size:13px;color:#f2d69c}.small{font-size:12px}label{font-size:14px}#content{min-height:45vh}.creator-preview{display:flex;justify-content:center;align-items:center;min-height:265px;background:radial-gradient(circle at 50% 80%,#365d52,#152a32 75%);border-radius:18px;border:1px solid #57776e}.creator-preview svg{width:min(100%,270px);height:auto;filter:drop-shadow(0 12px 10px #071415)}.choice-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 18px}.choice-grid button{padding:10px 6px;font-size:13px;background:#31494a;color:#fff;border:1px solid #70867d}.choice-grid button.chosen{background:#d7b97b;color:#17292a;outline:2px solid #f2d89b}.creator-label{font-size:14px;font-weight:700;color:#e9d5a8;margin-top:12px}.sun .creator-label{color:#4d4a27}.sun .choice-grid button:not(.chosen){background:#e4ebe5;color:#193537}.mini-bug{width:92px;flex:none}.hero .mini-bug{background:radial-gradient(ellipse at 48% 40%,#294e59 0%,#102831 62%,#09171e 100%);border:1px solid #4c7379;border-radius:16px;padding:5px;box-shadow:inset 0 0 18px #07151b,0 3px 12px #07151b66}.hero .mini-bug svg{display:block;width:100%;height:auto}.sun .hero .mini-bug{background:radial-gradient(ellipse at 50% 35%,#315866,#142e38 70%,#0a1a23)}.creator-note{font-size:12px;color:#d4d9d0} </style></head><body><div class="app"><header><div><div class="eyebrow">A little place to grow</div><h1>Pinecone Bug</h1></div><div class="moon" id="sky">🌙</div></header><div class="row between" style="margin-top:8px"><span class="chip" id="modeLabel">Adult forest</span><button class="ghost" onclick="openSettings()">⚙ Customize</button></div><main id="content"></main></div><nav class="nav" id="nav"></nav><script>
const KEY='pinecone-bug-v01';const defaults={mode:'adult',theme:'moon',auto:false,widgets:['bug','mood','weather','tasks','tools','calendar'],mood:'',tasks:[{text:'Take one small step',done:false}],notes:[],calm:'',sprigs:0,character:{hair:'white',glasses:'black',scarf:'moss',boots:'brown',expression:'happy',name:'My Pinecone Bug',twoTone:false,hairTips:'blue',cane:false,hearing:false},speakButtons:false};let s={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')},page='home',timer=null,seconds=300;s.character={...defaults.character,...(s.character||{})};const save=()=>localStorage.setItem(KEY,JSON.stringify(s));const names={bug:'My Pinecone Bug',mood:'How are you feeling?',weather:'Forest Weather',tasks:'Today’s Tasks',tools:'Tools & Timers',calendar:'Calendar',journal:'Journal & Glimmers',forests:'My Forests',chores:'My Chores',calm:'Calm Sounds',goals:'Goals',school:'School & Study'};const icons={bug:'🌲',mood:'💛',weather:'🌦️',tasks:'✅',tools:'⏱️',calendar:'📅',journal:'✨',forests:'🏡',chores:'🧺',calm:'🎵',goals:'🎯',school:'📚'};const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function applyTheme(){let day=s.auto?(new Date().getHours()>=7&&new Date().getHours()<19):s.theme==='sun';document.body.className=s.theme==='plain'?'plain':day?'sun':'';document.getElementById('sky').textContent=day?'☀️':'🌙';document.getElementById('modeLabel').textContent={adult:'Adult forest',teen:'Teen forest',little:'Little Sprouts'}[s.mode]}function moodBox(){return `<div class="card"><h2>How are you feeling today?</h2><div class="moods">${[['green','🌰','Good'],['yellow','🍂','In between'],['red','🌧️','Having a hard day']].map(([id,emoji,name])=>`<button class="mood ${s.mood===id?'selected':''}" onclick="setMood('${id}')"><span>${emoji}</span>${name}</button>`).join('')}</div><p class="muted">Every feeling is welcome. Your energy can be different from your mood.</p></div>`}function widget(id){if(id==='mood')return moodBox();if(id==='bug')return `<div class="card hero"><div class="mini-bug">${bugSvg()}</div><div><h2>${safe(s.character.name)}</h2><p class="muted">Your woodland companion is here, just as you are.</p><span class="chip">🌿 ${s.sprigs} Sprigs</span><p><button class="secondary" onclick="go('creator')">✏️ Customize My Bug</button></p></div></div>`;if(id==='weather')return `<div class="card"><h2>🌦️ Forest Weather</h2><p>${s.mood==='red'?'A rainy moment. Mushrooms can grow in the rain.':s.mood==='yellow'?'Clouds and little patches of light.':'A quiet moonlit forest, with room for every feeling.'}</p><span class="muted">Emotional weather is private unless you choose to share.</span></div>`;if(id==='tasks'||id==='chores')return `<div class="card"><h2>${icons[id]} ${names[id]}</h2>${s.tasks.map((t,i)=>`<label class="task ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})">${safe(t.text)}</label>`).join('')}<form onsubmit="addTask(event)" class="row"><input id="taskInput" placeholder="Add a small task" aria-label="New task" style="flex:1"><button>Add</button></form></div>`;if(id==='tools')return `<div class="card"><h2>⏱️ Tools & Timers</h2><div class="row"><button class="secondary" onclick="startTimer(300)">5 min</button><button class="secondary" onclick="startTimer(900)">15 min</button><button class="secondary" onclick="stopTimer()">Pause</button><span id="clock" class="chip">${formatTime(seconds)}</span></div><p class="muted">Quick Capture: save a thought without organizing it first.</p><form class="row" onsubmit="addNote(event)"><input id="noteInput" placeholder="What's on your mind?" style="flex:1" aria-label="Quick capture"><button>Save</button></form></div>`;if(id==='calm')return `<div class="card"><h2>🎵 Calm Sounds</h2><p class="muted">Choose a peaceful sound. Audio playback will be added in a later build.</p><div class="row">${['Rain','Stream','Birds','Wind'].map(x=>`<button class="secondary" onclick="calm('${x}')">${x}</button>`).join('')}</div><p>${s.calm?'Selected: '+safe(s.calm):'No sound selected'}</p></div>`;if(id==='journal')return `<div class="card"><h2>✨ Journal & Glimmers</h2><form onsubmit="addNote(event)" class="row"><input id="noteInput" placeholder="Capture a glimmer or thought" style="flex:1" aria-label="Journal entry"><button>Save</button></form>${s.notes.slice().reverse().slice(0,5).map(x=>`<p class="muted">✨ ${safe(x)}</p>`).join('')}</div>`;return `<div class="card"><h2>${icons[id]} ${names[id]}</h2><p class="muted">A home for ${names[id].toLowerCase()} is coming in a future version.</p></div>`}function bugSvg(){const c=s.character;const hair={white:'#f6f1e6',purple:'#b8a0ef',blue:'#174e68',pink:'#D88EAB',green:'#527B57',auburn:'#b76c43',black:'#37343a',gold:'#e7bd69'}[c.hair]||'#f6f1e6';const scarf={moss:'#7ca66b',plum:'#ad83bc',sunshine:'#e9c66a',stormblue:'#174e68',pink:'#D88EAB',green:'#527B57',none:'transparent'}[c.scarf];const boot={brown:'#754a34',red:'#ba5e50',blue:'#174e68',pink:'#D88EAB',green:'#527B57'}[c.boots];const eyes=c.expression==='sleepy'?'<path d="M99 114q12 10 24 0 M148 114q12 10 24 0" stroke="#3d2e27" stroke-width="4" fill="none"/>':'<circle cx="112" cy="112" r="7" fill="#242322"/><circle cx="158" cy="112" r="7" fill="#242322"/><circle cx="114" cy="109" r="2.5" fill="white"/><circle cx="160" cy="109" r="2.5" fill="white"/>';const mouth=c.expression==='meh'?'M126 153h21':c.expression==='sad'?'M125 160q12 -13 25 0':'M124 151q15 18 30 0';let hairStr='';for(let i=0;i<26;i++){let a=i*Math.PI*2/26;let x=135+Math.cos(a)*59,y=94+Math.sin(a)*50;let x2=135+Math.cos(a)*83,y2=94+Math.sin(a)*72;let cx=x2+Math.sin(i*4)*16,cy=y2-10,ex=x2+Math.cos(i*7)*9,ey=y2-19;hairStr+=`<path d="M${x.toFixed(1)} ${y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${hair}" stroke-width="5" stroke-linecap="round" fill="none"/>`;if(c.twoTone){let t=.67,mx=(1-t)*(1-t)*x+2*(1-t)*t*cx+t*t*ex,my=(1-t)*(1-t)*y+2*(1-t)*t*cy+t*t*ey,tx=(1-t)*cx+t*ex,ty=(1-t)*cy+t*ey;let tipColor={white:'#f6f1e6',purple:'#b8a0ef',blue:'#174e68',pink:'#D88EAB',green:'#527B57',auburn:'#b76c43',black:'#37343a',gold:'#e7bd69'}[c.hairTips]||'#174e68';hairStr+=`<path d="M${mx.toFixed(1)} ${my.toFixed(1)} Q${tx.toFixed(1)} ${ty.toFixed(1)} ${ex.toFixed(1)} ${ey.toFixed(1)}" stroke="${tipColor}" stroke-width="5.2" stroke-linecap="round" fill="none"/>`; }}return `<svg viewBox="0 0 270 300" role="img" aria-label="Customized Pinecone Bug with ${safe(c.hair)} hair${c.twoTone?` and ${safe(c.hairTips)} tips`:``}"><ellipse cx="136" cy="283" rx="76" ry="9" fill="#081b1b" opacity=".45"/><path d="M111 232l-15 35m64-35 16 35" stroke="#4d3429" stroke-width="8" stroke-linecap="round"/><ellipse cx="92" cy="270" rx="26" ry="12" fill="${boot}"/><ellipse cx="181" cy="270" rx="26" ry="12" fill="${boot}"/><path d="M75 163Q48 196 83 242Q133 275 184 242Q219 197 191 163Z" fill="#83522f" stroke="#3b2c20" stroke-width="5"/>${Array.from({length:5},(_,r)=>Array.from({length:4},(_,i)=>`<path d="M${81+i*27+(r%2)*9} ${176+r*15}q12 -9 24 0l-12 20Z" fill="${(r+i)%2?'#ad7541':'#70432b'}" stroke="#593a25" stroke-width="2"/>`).join('')).join('')}<path d="M79 188Q42 173 50 214M193 188Q225 174 219 213" fill="none" stroke="#805333" stroke-width="10" stroke-linecap="round"/>${hairStr}<ellipse cx="135" cy="118" rx="67" ry="66" fill="#b9804b" stroke="#704a30" stroke-width="4"/><ellipse cx="135" cy="132" rx="54" ry="43" fill="#d49a61"/><circle cx="112" cy="111" r="23" fill="#fff6e5"/><circle cx="158" cy="111" r="23" fill="#fff6e5"/>${eyes}<path d="M135 113q28 8 13 29q-12 9 -26 -1Z" fill="#b77642" stroke="#80512d" stroke-width="2"/><path d="${mouth}" stroke="#61392d" stroke-width="4" stroke-linecap="round" fill="none"/>${c.glasses==='none'?'':`<g fill="none" stroke="${c.glasses==='gold'?'#d7bc77':c.glasses==='brown'?'#70462e':c.glasses==='stormblue'?'#174e68':c.glasses==='pink'?'#D88EAB':c.glasses==='green'?'#527B57':'#1c2024'}" stroke-width="4"><circle cx="112" cy="112" r="27"/><circle cx="158" cy="112" r="27"/><path d="M139 111h-2M85 106l-20 -9M185 106l19 -9"/></g>`}${c.hearing?'<path d="M193 112q13 4 9 21q-2 9 -10 9" fill="none" stroke="#d2b58a" stroke-width="7" stroke-linecap="round"/><rect x="188" y="124" width="8" height="15" rx="4" fill="#d2b58a"/>':''}${c.cane?'<path d="M217 194L236 277" stroke="#f4f0e7" stroke-width="6" stroke-linecap="round"/><path d="M231 260l5 17" stroke="#db554f" stroke-width="7"/><path d="M217 194l-5 -10" stroke="#282b30" stroke-width="7" stroke-linecap="round"/>':''}${c.scarf==='none'?'':`<path d="M86 173Q132 192 188 170l-8 24Q134 210 90 194Z" fill="${scarf}"/><path d="M156 190l11 49 18 -7 -6 -44Z" fill="${scarf}"/>`}</svg>`}
function setCharacter(k,v){s.character[k]=(k==='cane'||k==='hearing')?v==='true':v;save();render()}
function swapHair(){let c=s.character;let old=c.hair;c.hair=c.hairTips;c.hairTips=old;save();render()}function toggleTwoTone(){s.character.twoTone=!s.character.twoTone;save();render()}function creator(){let c=s.character;const groups=[['hair','Wild Hair',[['white','Snowy White'],['purple','Purple'],['blue','Stormy Blue'],['pink','Soft Pink'],['green','Forest Green'],['auburn','Auburn'],['black','Midnight'],['gold','Golden']]],['glasses','Glasses',[['black','Black'],['brown','Brown'],['gold','Golden'],['stormblue','Stormy Blue'],['pink','Soft Pink'],['green','Forest Green'],['none','No glasses']]],['scarf','Scarf',[['moss','Moss'],['plum','Plum'],['sunshine','Sunshine'],['stormblue','Stormy Blue'],['pink','Soft Pink'],['green','Forest Green'],['none','No scarf']]],['boots','Boots',[['brown','Brown'],['red','Red'],['blue','Stormy Blue'],['pink','Soft Pink'],['green','Forest Green']]],['cane','White Cane',[['false','No cane'],['true','White cane']]],['hearing','Hearing Device',[['false','None'],['true','Hearing device']]],['expression','Expression',[['happy','Happy'],['meh','Meh'],['sad','Sad'],['sleepy','Sleepy']]]];return `<div class="card"><div class="row between"><h2>🍄 Create Your Pinecone Bug</h2><button class="secondary" onclick="go('home')">Done ✓</button></div><p class="muted">Make your woodland friend your own. Your choices save on this device.</p><div class="creator-preview">${bugSvg()}</div><label class="creator-label" for="bugName">Your Bug's name</label><div style="margin:8px 0 18px"><input id="bugName" maxlength="35" value="${safe(c.name)}" onchange="setCharacter('name',this.value.trim()||'My Pinecone Bug')" style="width:100%"></div><div class="card" style="background:#142d37"><h2>🎨 Two-Tone Hair Studio</h2><label class="row"><input type="checkbox" ${c.twoTone?'checked':''} onchange="toggleTwoTone()"> Add colorful hair tips</label>${c.twoTone?`<div class="creator-label">Hair tips color</div><div class="choice-grid">${[['white','Snowy White'],['purple','Purple'],['blue','Stormy Blue'],['pink','Soft Pink'],['green','Forest Green'],['auburn','Auburn'],['black','Midnight Black'],['gold','Golden']].map(([v,t])=>`<button class="${c.hairTips===v?'chosen':''}" aria-pressed="${c.hairTips===v}" onclick="setCharacter('hairTips','${v}')">${t}</button>`).join('')}</div><button class="secondary" onclick="swapHair()">⇄ Swap main color & tips</button><p class="muted">Tip: Choose the main hair color below under Wild Hair.</p>`:'<p class="muted">Turn this on to choose a second color for the ends of your Bug’s wild hair.</p>'}</div>${groups.map(([id,label,options])=>`<div class="creator-label">${label}</div><div class="choice-grid">${options.map(([v,t])=>`<button class="${String(c[id])===v?'chosen':''}" aria-pressed="${String(c[id])===v}" onclick="setCharacter('${id}','${v}')">${['hair','glasses','scarf','boots'].includes(id)&&({white:'#f6f1e6',purple:'#b8a0ef',blue:'#174e68',pink:'#D88EAB',green:'#527B57',auburn:'#b76c43',black:'#37343a',gold:'#e7bd69',brown:'#754a34',moss:'#7ca66b',plum:'#ad83bc',sunshine:'#e9c66a',stormblue:'#174e68',red:'#ba5e50'})[v]?`<span aria-hidden="true" style="display:inline-block;vertical-align:middle;width:14px;height:14px;border-radius:50%;background:${({white:'#f6f1e6',purple:'#b8a0ef',blue:'#174e68',pink:'#D88EAB',green:'#527B57',auburn:'#b76c43',black:'#37343a',gold:'#e7bd69',brown:'#754a34',moss:'#7ca66b',plum:'#ad83bc',sunshine:'#e9c66a',stormblue:'#174e68',red:'#ba5e50'})[v]};border:1px solid #81949b;margin-right:7px"></span>`:``}${t}</button>`).join('')}</div>`).join('')}<p class="creator-note">Version 0.7: this is an original, lightweight illustrated character preview. Chore pictures and animations featuring your exact Bug are coming in a later build.</p></div>`}
function home(){let ids=s.mode==='little'?['bug','forests','chores','mood','calm']:s.widgets;return `<p class="muted">${s.mode==='little'?'Welcome to your little forest!':'Welcome back. You can take today one small step at a time.'}</p>${ids.map(widget).join('')}`};function settings(){let available=s.mode==='teen'?['bug','mood','weather','tasks','calendar','tools','school','goals','journal','forests','calm']:['bug','mood','weather','tasks','calendar','tools','journal','forests','goals','calm'];return `<div class="card"><h2>Customize My Home</h2><p><button onclick="go('creator')">🌰 Open Character Creator</button></p><p class="muted">Choose your age layout and what appears on your home screen. Changes save on this device.</p><label>Home screen type</label><div class="row" style="margin:10px 0"><select onchange="setMode(this.value)"><option value="adult" ${s.mode==='adult'?'selected':''}>Adult</option><option value="teen" ${s.mode==='teen'?'selected':''}>Teen</option><option value="little" ${s.mode==='little'?'selected':''}>Little Sprouts</option></select></div><label class="row"><input type="checkbox" ${s.speakButtons?'checked':''} onchange="s.speakButtons=this.checked;save();render()"> 🔊 Speak button names when tapped</label><p class="muted">Uses your device's speech voice. Android TalkBack is also supported through labeled controls.</p><label>Forest appearance</label><div class="row" style="margin:10px 0"><select onchange="setTheme(this.value)"><option value="moon" ${s.theme==='moon'?'selected':''}>🌙 Moonlit Forest</option><option value="sun" ${s.theme==='sun'?'selected':''}>☀️ Daylight Forest</option><option value="plain" ${s.theme==='plain'?'selected':''}>🌿 Simple & Peaceful</option></select></div><label class="row"><input type="checkbox" ${s.auto?'checked':''} onchange="s.auto=this.checked;save();render()"> Change with day and night</label>${s.mode==='little'?'<p class="notice">Little Sprouts has a simpler, fixed layout for now.</p>':`<h2 style="margin-top:22px">Home sections</h2><p class="muted">Select sections and move them up or down.</p>${available.map(id=>`<div class="settings-row"><label><input type="checkbox" ${s.widgets.includes(id)?'checked':''} onchange="toggleWidget('${id}')"> ${icons[id]} ${names[id]}</label><div class="row"><button class="secondary" aria-label="Move ${names[id]} up" onclick="moveWidget('${id}',-1)">↑</button><button class="secondary" aria-label="Move ${names[id]} down" onclick="moveWidget('${id}',1)">↓</button></div></div>`).join('')}`}<p class="muted">Your mood, notes, and tasks are stored locally in this browser. This is a prototype, not a private cloud account.</p></div>`}function render(){applyTheme();document.getElementById('content').innerHTML=page==='settings'?settings():page==='creator'?creator():page==='home'?home():widget(page);document.getElementById('nav').innerHTML=[['home','🏠','Home'],['tasks','✅','Tasks'],['mood','💛','Check-in'],['journal','✨','Journal'],['creator','🌰','My Bug']].map(([id,emoji,label])=>`<button class="${page===id?'active':''}" onclick="go('${id}')">${emoji}<br>${label}</button>`).join('')}function go(p){page=p;render();scrollTo(0,0)}function speak(text){if(!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.rate=.88;window.speechSynthesis.speak(u)}document.addEventListener('click',e=>{if(!s.speakButtons)return;let b=e.target.closest('button');if(b)speak(b.getAttribute('aria-label')||b.innerText.replace(/\s+/g,' ').trim()||'Button')});function openSettings(){go('settings')}function setMood(m){s.mood=m;save();render()}function toggleTask(i){if(s.speakButtons)speak(s.tasks[i].text+(s.tasks[i].done?' not completed':' completed')); s.tasks[i].done=!s.tasks[i].done;if(s.tasks[i].done)s.sprigs+=1;save();render()}function addTask(e){e.preventDefault();let v=document.getElementById('taskInput').value.trim();if(v)s.tasks.push({text:v,done:false});save();render()}function addNote(e){e.preventDefault();let v=document.getElementById('noteInput').value.trim();if(v)s.notes.push(v);save();render()}function setMode(v){s.mode=v;if(v==='teen'&&!s.widgets.includes('school'))s.widgets.push('school');save();render()}function setTheme(v){s.theme=v;s.auto=false;save();render()}function toggleWidget(id){s.widgets=s.widgets.includes(id)?s.widgets.filter(x=>x!==id):[...s.widgets,id];save();render()}function moveWidget(id,d){let i=s.widgets.indexOf(id);if(i<0)return;let j=i+d;if(j<0||j>=s.widgets.length)return;[s.widgets[i],s.widgets[j]]=[s.widgets[j],s.widgets[i]];save();render()}function calm(x){s.calm=x;save();render()}function formatTime(t){return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`}function startTimer(n){clearInterval(timer);seconds=n;timer=setInterval(()=>{seconds--;let el=document.getElementById('clock');if(el)el.textContent=formatTime(Math.max(seconds,0));if(seconds<=0){clearInterval(timer);alert('Your timer is finished. 🌲')}},1000);render()}function stopTimer(){clearInterval(timer)}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
